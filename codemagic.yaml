workflows:
  silverray-ios-release:
    name: Silver Ray CRM iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.silverray.crm
      vars:
        XCODE_PROJECT: "SilverRayCRM.xcodeproj"
        XCODE_SCHEME: "SilverRayCRM"
        BUNDLE_ID: "com.silverray.crm"
      xcode: latest
    scripts:
      - name: Inject iOS GoogleService-Info.plist if provided via Codemagic secret
        script: |
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > Resources/GoogleService-Info.plist
            echo "Injected GoogleService-Info.plist from Codemagic environment variable."
          fi
          if ! grep -q "GOOGLE_APP_ID" Resources/GoogleService-Info.plist; then
            echo "WARNING: Resources/GoogleService-Info.plist does not contain GOOGLE_APP_ID yet."
            echo "Download the iOS GoogleService-Info.plist for com.silverray.crm from Firebase Console (project silverrayrealtyweb) before App Store release."
          fi
      - name: Install XcodeGen and Generate Xcode Project
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Resolve Swift Package Dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Apply Provisioning Profiles
        script: |
          xcode-project use-profiles
      - name: Increment Build Number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo 0)
          NEW_BUILD=$((LATEST_BUILD + 1))
          agvtool new-version -all "$NEW_BUILD" || true
      - name: Build Signed IPA for Silver Ray CRM
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  silverray-ios-unsigned-check:
    name: Silver Ray CRM iOS Unsigned CI Verification
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "SilverRayCRM.xcodeproj"
        XCODE_SCHEME: "SilverRayCRM"
      xcode: latest
    scripts:
      - name: Install XcodeGen and Generate Xcode Project
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate
      - name: Resolve Swift Package Dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build & Archive Unsigned Verification Build
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$CM_BUILD_DIR/SilverRayCRM.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
    artifacts:
      - $CM_BUILD_DIR/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
